name: Bug
description: Something on the site is broken or wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A result with numbers that look wrong is not a bug — use the flag button on the result itself.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page
      placeholder: /hardware/intel-arc-b580
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 145, Windows 11
